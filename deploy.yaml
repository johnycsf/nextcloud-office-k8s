# Nextcloud + Collabora Online (LibreOffice) on Kubernetes
# Nextcloud image docs: https://docs.linuxserver.io/images/docker-nextcloud/
# Office integration:   https://docs.nextcloud.com/server/latest/admin_manual/office/example-docker.html
#
# The LinuxServer Nextcloud image cannot run the built-in Collabora/CODE app.
# A separate collabora/code Deployment is required for Word/Excel/PPT editing.
apiVersion: v1
kind: Namespace
metadata:
  name: nextcloud
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-config
  namespace: nextcloud
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-data
  namespace: nextcloud
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: nextcloud
  labels:
    app: nextcloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      containers:
        - name: nextcloud
          # LinuxServer stable Nextcloud (includes nginx + PHP; SQLite by default)
          image: lscr.io/linuxserver/nextcloud:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/New_York"
          ports:
            - name: https
              containerPort: 443
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: nextcloud-config
        - name: data
          persistentVolumeClaim:
            claimName: nextcloud-data
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  type: LoadBalancer
  selector:
    app: nextcloud
  ports:
    - name: https
      port: 443
      targetPort: https
---
# Collabora Online Development Edition (CODE) — LibreOffice in the browser
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collabora
  namespace: nextcloud
  labels:
    app: collabora
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: collabora
  template:
    metadata:
      labels:
        app: collabora
    spec:
      # CODE's docker entrypoint expects a TTY
      containers:
        - name: collabora
          image: collabora/code:latest
          imagePullPolicy: IfNotPresent
          stdin: true
          tty: true
          env:
            # configure-office.sh overwrites these with your real Nextcloud / Collabora URLs
            - name: aliasgroup1
              value: "https://127.0.0.1:443"
            # Temporary allow-all until configure-office.sh sets your real host regex
            - name: domain
              value: ".*"
            - name: server_name
              value: "127.0.0.1:9980"
            - name: dictionaries
              value: "en_US"
            - name: username
              value: "admin"
            - name: password
              value: "changeme"
            - name: extra_params
              # Plain HTTP Collabora for homelab LoadBalancer access (no reverse proxy required).
              # ssl.ssl_verification=false lets Collabora fetch WOPI from self-signed Nextcloud.
              value: "--o:ssl.enable=false --o:ssl.termination=false --o:ssl.ssl_verification=false --o:welcome.enable=false --o:net.frame_ancestors=*"
          ports:
            - name: coolwsd
              containerPort: 9980
          securityContext:
            capabilities:
              add:
                - MKNOD
                - SYS_CHROOT
                - FOWNER
                - CHOWN
          # First start (image pull + coolwsd init) is slow
          startupProbe:
            httpGet:
              path: /
              port: coolwsd
              scheme: HTTP
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /hosting/discovery
              port: coolwsd
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: coolwsd
              scheme: HTTP
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 3Gi
---
apiVersion: v1
kind: Service
metadata:
  name: collabora
  namespace: nextcloud
spec:
  type: LoadBalancer
  selector:
    app: collabora
  ports:
    - name: coolwsd
      port: 9980
      targetPort: coolwsd
