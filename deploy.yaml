# Nextcloud + Collabora Online (LibreOffice) on k3s
# Nextcloud image docs: https://docs.linuxserver.io/images/docker-nextcloud/
# Office integration:   https://docs.nextcloud.com/server/latest/admin_manual/office/example-docker.html
#
# The LinuxServer Nextcloud image cannot run the built-in Collabora/CODE app.
# A separate collabora/code Deployment is required for Word/Excel/PPT editing.
apiVersion: v1
kind: Namespace
metadata:
  name: nextcloud
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-config
  namespace: nextcloud
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-data
  namespace: nextcloud
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: nextcloud
  labels:
    app: nextcloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      containers:
        - name: nextcloud
          # LinuxServer stable Nextcloud (includes nginx + PHP; SQLite by default)
          image: lscr.io/linuxserver/nextcloud:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/New_York"
          ports:
            - name: https
              containerPort: 443
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: nextcloud-config
        - name: data
          persistentVolumeClaim:
            claimName: nextcloud-data
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  type: LoadBalancer
  selector:
    app: nextcloud
  ports:
    - name: https
      port: 443
      targetPort: https
---
# Collabora Online Development Edition (CODE) — LibreOffice in the browser
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collabora
  namespace: nextcloud
  labels:
    app: collabora
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: collabora
  template:
    metadata:
      labels:
        app: collabora
    spec:
      containers:
        - name: collabora
          image: collabora/code:latest
          imagePullPolicy: IfNotPresent
          env:
            # install.sh / configure-office.sh overwrite these with your real URLs
            - name: aliasgroup1
              value: "https://CHANGE_ME:443"
            - name: domain
              value: "CHANGE_ME"
            - name: dictionaries
              value: "en_US"
            - name: extra_params
              # Homelab-friendly: Collabora serves HTTP; allow WOPI to self-signed Nextcloud
              value: >-
                --o:ssl.enable=false
                --o:ssl.termination=false
                --o:welcome.enable=false
                --o:net.frame_ancestors=*
                --o:storage.wopi.ssl_verification=false
            - name: username
              value: "admin"
            - name: password
              value: "changeme"
          ports:
            - name: coolwsd
              containerPort: 9980
          securityContext:
            capabilities:
              add:
                - MKNOD
                - SYS_CHROOT
                - FOWNER
                - CHOWN
          readinessProbe:
            httpGet:
              path: /hosting/discovery
              port: coolwsd
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 30
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: collabora
  namespace: nextcloud
spec:
  type: LoadBalancer
  selector:
    app: collabora
  ports:
    - name: coolwsd
      port: 9980
      targetPort: coolwsd
