# Nextcloud + Collabora Online (LibreOffice) on Kubernetes
# Official Nextcloud image: https://hub.docker.com/_/nextcloud
# Office integration:       https://docs.nextcloud.com/server/latest/admin_manual/office/example-docker.html
#
# Built-in in-container Office editors are unreliable; this stack uses a separate
# collabora/code Deployment for Word/Excel/PPT editing.
apiVersion: v1
kind: Namespace
metadata:
  name: nextcloud
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-html
  namespace: nextcloud
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: nextcloud
  labels:
    app: nextcloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      containers:
        - name: nextcloud
          # Official Nextcloud Apache image (SQLite is fine for small homelabs)
          image: nextcloud:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: "America/New_York"
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /var/www/html
          readinessProbe:
            httpGet:
              path: /status.php
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: html
          persistentVolumeClaim:
            claimName: nextcloud-html
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  type: LoadBalancer
  selector:
    app: nextcloud
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Collabora Online Development Edition (CODE) — LibreOffice in the browser
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collabora
  namespace: nextcloud
  labels:
    app: collabora
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: collabora
  template:
    metadata:
      labels:
        app: collabora
    spec:
      containers:
        - name: collabora
          image: collabora/code:latest
          imagePullPolicy: IfNotPresent
          stdin: true
          tty: true
          env:
            # configure-office.sh overwrites these with your real Nextcloud / Collabora URLs
            - name: aliasgroup1
              value: "http://127.0.0.1:80"
            - name: domain
              value: ".*"
            - name: server_name
              value: "127.0.0.1:9980"
            - name: dictionaries
              value: "en_US"
            - name: username
              value: "admin"
            - name: password
              value: "changeme"
            - name: extra_params
              value: "--o:ssl.enable=false --o:ssl.termination=false --o:ssl.ssl_verification=false --o:welcome.enable=false --o:net.frame_ancestors=*"
          ports:
            - name: coolwsd
              containerPort: 9980
          securityContext:
            capabilities:
              add:
                - MKNOD
                - SYS_CHROOT
                - FOWNER
                - CHOWN
          startupProbe:
            httpGet:
              path: /
              port: coolwsd
              scheme: HTTP
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /hosting/discovery
              port: coolwsd
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: coolwsd
              scheme: HTTP
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 3Gi
---
apiVersion: v1
kind: Service
metadata:
  name: collabora
  namespace: nextcloud
spec:
  type: LoadBalancer
  selector:
    app: collabora
  ports:
    - name: coolwsd
      port: 9980
      targetPort: coolwsd
